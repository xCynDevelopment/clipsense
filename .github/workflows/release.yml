name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    uses: ./.github/workflows/build-installers.yml

  pypi:
    needs: installers
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            clipsense-installer.exe
            clipsense-installer-mac.zip
